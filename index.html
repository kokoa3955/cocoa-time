<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="端末内で使う、あなたのためのスクリーンタイム手帳。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self'"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <title>Cocoa Time｜じぶんの時間を、取り戻す。</title>
  </head>
  <body>
    <div id="app">
      <main class="boot">
        <div class="brand">Cocoa Time</div>
        <p role="status">端末の記録を読み込んでいます…</p>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog">
      <div id="dialog-content"></div>
      <button id="dialog-close" class="primary">閉じる</button>
    </dialog>
    <script type="module" src="./app.js"></script>
    <noscript>JavaScriptを有効にしてご利用ください。</noscript>
  </body>
</html>
